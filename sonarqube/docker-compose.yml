version: "3.3"
services:
  reverse-proxy:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./www/index.html:/usr/share/nginx/html/index.html
    ports:
      - 80:80
      - 5432:5432
      - 9000:9000
      - 9002:9002
    restart: always
    networks: 
      - sonarqube-network

  sonarqube:
    image: sonarqube
    
    environment: 
      - sonar__jdbc__url=jdbc:postgresql://db:5432/sonar
      - sonar__jdbc__username=sonar
      - sonar__jdbc__password=sonar
    depends_on: 
      - db
    networks: 
      - sonarqube-network

  # scanner:
  #   image: sonarsource/sonar-scanner-cli
  #   environment: 
  #     - SONAR_HOST_URL=http://sonarqube:9000
  #   volumes: 
  #     - ./src/:/usr/src
  #   restart: always
  #   links: 
  #     - sonarqube
  #   depends_on: 
  #     - sonarqube
  #   networks: 
  #     - sonarqube-network

  db:
    image: postgres:12
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    networks: 
      - sonarqube-network

networks: 
  sonarqube-network:
    driver: bridge